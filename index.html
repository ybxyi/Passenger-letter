<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passenger Letter Generator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --ink: #1a1a2e;
    --accent: #c84b31;
    --border: #2e2e4a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { font-family: 'IBM Plex Sans', sans-serif; background: #e8e2d8; }

  @media screen {
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 100vh;
    }

    /* FORM */
    .form-panel {
      background: var(--ink);
      color: #e8e2d8;
      padding: 28px 24px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .form-panel h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3px;
    }
    .form-panel .sub {
      font-size: 11px;
      color: #6a6680;
      margin-bottom: 22px;
    }
    .sec {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 20px 0 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 10px;
      font-weight: 500;
      color: #8a86a0;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      background: #12122a;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #e8e2d8;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: #3a3a55; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn-print {
      width: 100%;
      margin-top: 22px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-print:hover { background: #a83828; }

    /* PREVIEW */
    .preview-panel {
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8a8590;
      margin-bottom: 16px;
      align-self: flex-start;
    }
  }

  /* PDF CANVAS WRAPPER */
  .pdf-wrap {
    position: relative;
    display: inline-block;
    box-shadow: 0 4px 40px rgba(0,0,0,0.2);
  }
  #pdfCanvas { display: block; }

  /* OVERLAY FIELDS */
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .ov-field {
    position: absolute;
    pointer-events: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    color: #1a1a1a;
    white-space: nowrap;
    overflow: hidden;
  }

  /* PRINT */
  @media print {
    body { background: white; }
    .layout { display: block; }
    .form-panel, .preview-label { display: none !important; }
    .preview-panel { padding: 0; }
    .pdf-wrap { box-shadow: none; }
  }
</style>
</head>
<body>
<div class="layout">

  <!-- FORM -->
  <aside class="form-panel">
    <h1>Passenger Letter</h1>
    <p class="sub">Заполни поля — они появятся на документе</p>

    <div class="sec">Carrier</div>
    <div class="field"><label>Carrier Name</label><input id="carrierName" placeholder="ABC Trucking LLC" oninput="overlay()"></div>
    <div class="field"><label>DOT #</label><input id="dotNum" placeholder="1234567" oninput="overlay()"></div>
    <div class="field"><label>Last 6 VIN #s</label><input id="vin6" placeholder="AB1234" maxlength="6" oninput="overlay()"></div>

    <div class="sec">Driver / Route</div>
    <div class="field"><label>Driver / Operator</label><input id="driverName" placeholder="John Smith" oninput="overlay()"></div>
    <div class="row2">
      <div class="field"><label>Origin</label><input id="origin" placeholder="Chicago, IL" oninput="overlay()"></div>
      <div class="field"><label>Destination</label><input id="dest" placeholder="Dallas, TX" oninput="overlay()"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Start Date</label><input id="startDate" type="date" oninput="overlay()"></div>
      <div class="field"><label>End Date</label><input id="endDate" type="date" oninput="overlay()"></div>
    </div>

    <div class="sec">Passenger</div>
    <div class="field"><label>Passenger Full Name</label><input id="passenger" placeholder="Jane Doe" oninput="overlay()"></div>

    <div class="sec">Carrier Rep</div>
    <div class="field"><label>Representative Name</label><input id="repName" placeholder="Mike Johnson" oninput="overlay()"></div>
    <div class="field"><label>Auth Date</label><input id="authDate" type="date" oninput="overlay()"></div>

    <button class="btn-print" onclick="window.print()">🖨 Print / Save as PDF</button>
  </aside>

  <!-- PREVIEW -->
  <main class="preview-panel">
    <div class="preview-label">Live Preview — поверх оригинального PDF</div>
    <div class="pdf-wrap">
      <canvas id="pdfCanvas"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>
  </main>
</div>

let pdfScale = 1;
let canvasW = 700;

// Render PDF
async function renderPDF() {
  const bytes = Uint8Array.from(atob(PDF_B64), c => c.charCodeAt(0));
  const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
  const page = await pdf.getPage(1);

  const canvas = document.getElementById('pdfCanvas');
  const wrap = canvas.parentElement;

  // fit to available width
  const avail = Math.min(window.innerWidth - 340 - 64, 780);
  const vp0 = page.getViewport({ scale: 1 });
  pdfScale = avail / vp0.width;
  canvasW = avail;

  const vp = page.getViewport({ scale: pdfScale });
  canvas.width = vp.width;
  canvas.height = vp.height;

  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  overlay();
}

function v(id) { return document.getElementById(id).value.trim(); }

function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${m}/${day}/${y}`;
}

// All positions as % of original PDF size (612 x 792 pts typical US letter)
// These are tuned to the actual layout of Passenger_Leter.pdf
const FIELDS = [
  // [id, left%, top%, fontSize_pt]
  { id: 'pCarrier',   l: 1.5,  t: 4.5,  fs: 13 },
  { id: 'pDot',       l: 43,   t: 4.5,  fs: 13 },
  { id: 'pVin',       l: 68,   t: 4.5,  fs: 13 },
  { id: 'pDriver',    l: 1.5,  t: 12.5, fs: 13 },
  { id: 'pPassenger', l: 43,   t: 12.5, fs: 13 },
  { id: 'pRoute',     l: 1.5,  t: 20.5, fs: 12 },
  { id: 'pDates',     l: 43,   t: 20.5, fs: 12 },
  { id: 'pRepName',   l: 1.5,  t: 66.5, fs: 11 },
  { id: 'pAuthDate',  l: 73,   t: 66.5, fs: 11 },
];

function overlay() {
  const canvas = document.getElementById('pdfCanvas');
  const H = canvas.height;
  const W = canvas.width;

  const values = {
    pCarrier:   v('carrierName'),
    pDot:       v('dotNum'),
    pVin:       v('vin6').toUpperCase(),
    pDriver:    v('driverName'),
    pPassenger: v('passenger'),
    pRoute:     (v('origin') && v('dest')) ? v('origin') + '  –  ' + v('dest') : (v('origin') || v('dest')),
    pDates:     (v('startDate') || v('endDate')) ? fmtDate(v('startDate')) + '  –  ' + fmtDate(v('endDate')) : '',
    pRepName:   v('repName'),
    pAuthDate:  fmtDate(v('authDate')),
  };

  const ov = document.getElementById('overlay');
  ov.innerHTML = '';

  FIELDS.forEach(f => {
    const txt = values[f.id];
    if (!txt) return;
    const el = document.createElement('div');
    el.className = 'ov-field';
    el.style.left = (f.l / 100 * W) + 'px';
    el.style.top  = (f.t / 100 * H) + 'px';
    el.style.fontSize = Math.round(f.fs * pdfScale) + 'px';
    el.textContent = txt;
    ov.appendChild(el);
  });
}

// init
const today = new Date().toISOString().split('T')[0];
document.getElementById('authDate').value = today;
renderPDF();
window.addEventListener('resize', renderPDF);
</script>
