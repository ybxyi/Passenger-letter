<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Generator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root { --ink: #1a1a2e; --accent: #c84b31; --border: #2e2e4a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; background: #e8e2d8; }

@media screen {
  .layout { display: grid; grid-template-columns: 340px 1fr; min-height: 100vh; }

  .form-panel {
    background: var(--ink); color: #e8e2d8;
    padding: 24px 22px; position: sticky; top: 0;
    height: 100vh; overflow-y: auto;
  }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 20px; }
  .tab-btn {
    background: #12122a; border: 1px solid var(--border); border-radius: 4px;
    color: #6a6680; font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 9px 6px; cursor: pointer; transition: all 0.2s;
  }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  .form-section { display: none; }
  .form-section.active { display: block; }

  .sec {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent);
    margin: 18px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--border);
  }
  .field { margin-bottom: 11px; }
  .field label {
    display: block; font-size: 10px; font-weight: 500; color: #8a86a0;
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;
  }
  .field input[type=text], .field input[type=date] {
    width: 100%; background: #12122a; border: 1px solid var(--border);
    border-radius: 4px; color: #e8e2d8; font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px; padding: 7px 10px; outline: none; transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: #3a3a55; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .check-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .check-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .check-item input[type=checkbox] { display: none; }
  .check-box {
    width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 3px;
    background: #12122a; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s;
  }
  .check-item input:checked + .check-box { background: var(--accent); border-color: var(--accent); }
  .check-item input:checked + .check-box::after { content: '✓'; color: white; font-size: 11px; font-weight: 700; }
  .check-item span { font-size: 11px; color: #c8c4d8; }

  .btn-print {
    width: 100%; margin-top: 20px; background: var(--accent); color: white;
    border: none; border-radius: 4px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 13px; cursor: pointer; transition: background 0.2s;
  }
  .btn-print:hover { background: #a83828; }

  .preview-panel { padding: 32px; display: flex; flex-direction: column; align-items: center; }
  .preview-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: #8a8590;
    margin-bottom: 16px; align-self: flex-start;
  }
}

.pdf-wrap { position: relative; display: inline-block; box-shadow: 0 4px 40px rgba(0,0,0,0.2); }
#pdfCanvas { display: block; }
.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.ov-field {
  position: absolute; pointer-events: none;
  font-family: 'IBM Plex Sans', sans-serif; font-weight: 600;
  color: #1a1a1a; white-space: nowrap; overflow: hidden;
}
.ov-check {
  position: absolute; pointer-events: none;
  font-weight: 900; color: #1a1a1a;
  display: flex; align-items: center; justify-content: center;
}

@media print {
  body { background: white; }
  .layout { display: block; }
  .form-panel, .preview-label { display: none !important; }
  .preview-panel { padding: 0; }
  .pdf-wrap { box-shadow: none; }
}
</style>
</head>
<body>
<div class="layout">

<aside class="form-panel">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('passenger')">Passenger Letter</button>
    <button class="tab-btn" onclick="switchTab('bat')">BAT Form</button>
  </div>

  <!-- PASSENGER -->
  <div class="form-section active" id="form-passenger">
    <div class="sec">Carrier</div>
    <div class="field"><label>Carrier Name</label><input id="p-carrierName" placeholder="ABC Trucking LLC" oninput="renderOverlay()"></div>
    <div class="field"><label>DOT #</label><input id="p-dotNum" placeholder="1234567" oninput="renderOverlay()"></div>
    <div class="field"><label>Last 6 VIN #s</label><input id="p-vin6" placeholder="AB1234" maxlength="6" oninput="renderOverlay()"></div>
    <div class="sec">Driver / Route</div>
    <div class="field"><label>Driver / Operator</label><input id="p-driver" placeholder="John Smith" oninput="renderOverlay()"></div>
    <div class="field"><label>Route</label><input id="p-origin" placeholder="Chicago, IL – Dallas, TX" oninput="renderOverlay()"></div>
    <div class="row2">
      <div class="field"><label>Start Date</label><input id="p-startDate" type="date" oninput="renderOverlay()"></div>
      <div class="field"><label>End Date</label><input id="p-endDate" type="date" oninput="renderOverlay()"></div>
    </div>
    <div class="sec">Passenger</div>
    <div class="field"><label>Passenger Full Name</label><input id="p-passenger" placeholder="Jane Doe" oninput="renderOverlay()"></div>
    <div class="sec">Carrier Rep</div>
    <div class="field"><label>Representative Name</label><input id="p-repName" placeholder="Mike Johnson" oninput="renderOverlay()"></div>
    <div class="field"><label>Auth Date</label><input id="p-authDate" type="date" oninput="renderOverlay()"></div>
    <button class="btn-print" onclick="window.print()">🖨 Print / Save as PDF</button>
  </div>

  <!-- BAT -->
  <div class="form-section" id="form-bat">
    <div class="sec">Patient Info</div>
    <div class="field"><label>Patient Name</label><input id="b-patient" placeholder="Jane Doe" oninput="renderOverlay()"></div>
    <div class="field"><label>Social Security Number</label><input id="b-ssn" placeholder="XXX-XX-XXXX" oninput="renderOverlay()"></div>
    <div class="field"><label>Employer</label><input id="b-employer" placeholder="Company Name" oninput="renderOverlay()"></div>
    <div class="field"><label>Date of Birth</label><input id="b-dob" type="date" oninput="renderOverlay()"></div>
    <div class="field"><label>Street Address</label><input id="b-address" placeholder="123 Main St" oninput="renderOverlay()"></div>
    <div class="field"><label>Location Number</label><input id="b-locnum" oninput="renderOverlay()"></div>
    <div class="field"><label>Temporary Staffing Agency</label><input id="b-agency" oninput="renderOverlay()"></div>
    <div class="sec">Work Related</div>
    <div class="check-group">
      <label class="check-item"><input type="checkbox" id="b-injury" onchange="renderOverlay()"><div class="check-box"></div><span>Injury</span></label>
      <label class="check-item"><input type="checkbox" id="b-illness" onchange="renderOverlay()"><div class="check-box"></div><span>Illness</span></label>
    </div>
    <div class="field"><label>Date of Injury</label><input id="b-injuryDate" type="date" oninput="renderOverlay()"></div>
    <div class="sec">Substance Abuse Testing</div>
    <div class="check-group">
      <label class="check-item"><input type="checkbox" id="b-regDrug" onchange="renderOverlay()"><div class="check-box"></div><span>Regulated drug screen</span></label>
      <label class="check-item"><input type="checkbox" id="b-breath" onchange="renderOverlay()"><div class="check-box"></div><span>Breath alcohol</span></label>
      <label class="check-item"><input type="checkbox" id="b-collect" onchange="renderOverlay()"><div class="check-box"></div><span>Collection only</span></label>
      <label class="check-item"><input type="checkbox" id="b-hair" onchange="renderOverlay()"><div class="check-box"></div><span>Hair collect</span></label>
      <label class="check-item"><input type="checkbox" id="b-nonReg" onchange="renderOverlay()"><div class="check-box"></div><span>Non-regulated drug screen</span></label>
      <label class="check-item"><input type="checkbox" id="b-rapid" onchange="renderOverlay()"><div class="check-box"></div><span>Rapid drug screen</span></label>
    </div>
    <div class="field"><label>Other</label><input id="b-satOther" oninput="renderOverlay()"></div>
    <div class="sec">Type of Substance Abuse Testing</div>
    <div class="check-group">
      <label class="check-item"><input type="checkbox" id="b-preplacement" onchange="renderOverlay()"><div class="check-box"></div><span>Preplacement</span></label>
      <label class="check-item"><input type="checkbox" id="b-reasonable" onchange="renderOverlay()"><div class="check-box"></div><span>Reasonable cause</span></label>
      <label class="check-item"><input type="checkbox" id="b-postAccident" onchange="renderOverlay()"><div class="check-box"></div><span>Post-accident</span></label>
      <label class="check-item"><input type="checkbox" id="b-random" onchange="renderOverlay()"><div class="check-box"></div><span>Random</span></label>
      <label class="check-item"><input type="checkbox" id="b-followup" onchange="renderOverlay()"><div class="check-box"></div><span>Follow-up</span></label>
    </div>
    <div class="sec">Physical Examination</div>
    <div class="check-group">
      <label class="check-item"><input type="checkbox" id="b-phyPre" onchange="renderOverlay()"><div class="check-box"></div><span>Preplacement</span></label>
      <label class="check-item"><input type="checkbox" id="b-phyBase" onchange="renderOverlay()"><div class="check-box"></div><span>Baseline</span></label>
      <label class="check-item"><input type="checkbox" id="b-phyAnnual" onchange="renderOverlay()"><div class="check-box"></div><span>Annual</span></label>
      <label class="check-item"><input type="checkbox" id="b-phyExit" onchange="renderOverlay()"><div class="check-box"></div><span>Exit</span></label>
    </div>
    <div class="sec">DOT Physical Examination</div>
    <div class="check-group">
      <label class="check-item"><input type="checkbox" id="b-dotPre" onchange="renderOverlay()"><div class="check-box"></div><span>Preplacement</span></label>
      <label class="check-item"><input type="checkbox" id="b-dotRecert" onchange="renderOverlay()"><div class="check-box"></div><span>Recertification</span></label>
    </div>
    <div class="sec">Special Examination</div>
    <div class="check-group">
      <label class="check-item"><input type="checkbox" id="b-asbestos" onchange="renderOverlay()"><div class="check-box"></div><span>Asbestos</span></label>
      <label class="check-item"><input type="checkbox" id="b-resp" onchange="renderOverlay()"><div class="check-box"></div><span>Respirator</span></label>
      <label class="check-item"><input type="checkbox" id="b-audio" onchange="renderOverlay()"><div class="check-box"></div><span>Audiogram</span></label>
      <label class="check-item"><input type="checkbox" id="b-hpe" onchange="renderOverlay()"><div class="check-box"></div><span>Human Performance Eval</span></label>
      <label class="check-item"><input type="checkbox" id="b-hazmat" onchange="renderOverlay()"><div class="check-box"></div><span>HAZMAT</span></label>
      <label class="check-item"><input type="checkbox" id="b-medSurv" onchange="renderOverlay()"><div class="check-box"></div><span>Medical Surveillance</span></label>
    </div>
    <div class="field"><label>Other</label><input id="b-specOther" oninput="renderOverlay()"></div>
    <div class="sec">Billing</div>
    <div class="check-group">
      <label class="check-item"><input type="checkbox" id="b-empPay" onchange="renderOverlay()"><div class="check-box"></div><span>Employee to pay charges</span></label>
    </div>
    <div class="sec">Authorization</div>
    <div class="field"><label>Special instructions/comments</label><input id="b-comments" oninput="renderOverlay()"></div>
    <div class="field"><label>Authorized by</label><input id="b-authBy" placeholder="Please print" oninput="renderOverlay()"></div>
    <div class="field"><label>Title</label><input id="b-title" oninput="renderOverlay()"></div>
    <div class="field"><label>Phone</label><input id="b-phone" oninput="renderOverlay()"></div>
    <div class="field"><label>Date</label><input id="b-date" type="date" oninput="renderOverlay()"></div>
    <button class="btn-print" onclick="window.print()">🖨 Print / Save as PDF</button>
  </div>
</aside>

<main class="preview-panel">
  <div class="preview-label" id="preview-label">Passenger Letter — Live Preview</div>
  <div class="pdf-wrap">
    <canvas id="pdfCanvas"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>
</main>
</div>

let currentTab = 'passenger';
let pdfScale = 1;
let canvasH = 1;

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='passenger')||(i===1&&tab==='bat')));
  document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
  document.getElementById('form-' + tab).classList.add('active');
  document.getElementById('preview-label').textContent = (tab==='passenger'?'Passenger Letter':'BAT Form') + ' — Live Preview';
  renderPDF();
}

async function renderPDF() {
  const b64 = PDFS[currentTab];
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
  const page = await pdf.getPage(1);
  const canvas = document.getElementById('pdfCanvas');
  const avail = Math.min(window.innerWidth - 340 - 64, 820);
  const vp0 = page.getViewport({ scale: 1, rotation: 0 });
  pdfScale = avail / vp0.width;
  canvasH = vp0.height * pdfScale;
  const vp = page.getViewport({ scale: pdfScale, rotation: 0 });
  canvas.width = vp.width;
  canvas.height = vp.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  // CSS flip for upside-down PDFs
  canvas.style.transform = '';
  renderOverlay();
}

function v(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function chk(id) { const el = document.getElementById(id); return el ? el.checked : false; }
function fmtDate(d) { if (!d) return ''; const [y,m,day] = d.split('-'); return `${m}/${day}/${y}`; }

function renderOverlay() {
  const canvas = document.getElementById('pdfCanvas');
  const W = canvas.width, H = canvas.height;
  const ov = document.getElementById('overlay');
  ov.innerHTML = '';
  if (currentTab === 'passenger') renderPassenger(W, H, ov);
  else renderBAT(W, H, ov);
}

// Place text at absolute pixel position derived from % of canvas size
// px/py = percent of width/height
function txt(ov, W, H, px, py, text, fs, maxW) {
  if (!text) return;
  const el = document.createElement('div');
  el.className = 'ov-field';
  el.style.left = (px / 100 * W) + 'px';
  el.style.top  = (py / 100 * H) + 'px';
  const baseFontPx = Math.round(fs * pdfScale);
  el.style.fontSize = baseFontPx + 'px';
  el.textContent = text;
  if (maxW) {
    const maxPx = maxW / 100 * W;
    el.style.maxWidth = maxPx + 'px';
    el.style.overflow = 'hidden';
    // after appending, measure and shrink font if needed
    ov.appendChild(el);
    let tries = 0;
    while (el.scrollWidth > maxPx && tries < 20) {
      const cur = parseFloat(el.style.fontSize);
      if (cur <= 6) break;
      el.style.fontSize = (cur - 0.5) + 'px';
      tries++;
    }
    return;
  }
  ov.appendChild(el);
}

function box(ov, W, H, px, py, checked) {
  if (!checked) return;
  const el = document.createElement('div');
  el.className = 'ov-check';
  const sz = Math.round(13 * pdfScale);
  el.style.left = (px / 100 * W) + 'px';
  el.style.top  = (py / 100 * H) + 'px';
  el.style.fontSize = sz + 'px';
  el.style.width = sz + 'px';
  el.style.height = sz + 'px';
  el.textContent = '✓';
  ov.appendChild(el);
}

// ── PASSENGER ──
// PDF layout (612×792 pts):
// Row1 top ~52pt  -> 52/792 = 6.6%   field input area ~57pt -> 7.2%
// Row2 top ~100pt -> 100/792 = 12.6% field input ~106pt -> 13.4%
// Row3 top ~148pt -> 148/792 = 18.7% field input ~153pt -> 19.3%
// RepName sig line ~527pt -> 66.5%
// RepName date ~527pt right side
function renderPassenger(W, H, ov) {
  // Calibrated coordinates from user clicks
  txt(ov,W,H,  8.5,  8.5,  v('p-carrierName'),             11, 40);
  txt(ov,W,H, 51.0,  8.5,  v('p-dotNum'),                  11, 14);
  txt(ov,W,H, 68.0,  8.5,  v('p-vin6').toUpperCase(),      11, 27);
  txt(ov,W,H,  8.0, 16.0,  v('p-driver'),                  11, 44);
  txt(ov,W,H, 55.0, 16.0,  v('p-passenger'),               11, 43);
  txt(ov,W,H,  8.0, 23.0,  v('p-origin'),                  11, 44);
  txt(ov,W,H, 54.7, 23.0,  fmtDate(v('p-startDate')),      11, 20);
  txt(ov,W,H, 71.5, 23.0,  '–',                            11);
  txt(ov,W,H, 77.0, 23.0,  fmtDate(v('p-endDate')),        11, 20);
  txt(ov,W,H, 10.0, 51.5,  v('p-repName'),                 11, 40);
  txt(ov,W,H, 77.0, 51.5,  fmtDate(v('p-authDate')),       11, 18);
  // Driver's date (same as auth date)
  txt(ov,W,H, 77.0, 87.0,  fmtDate(v('p-authDate')),       11, 18);
}

// ── BAT ──
// BAT PDF (Concentra form) approximate field positions
// Patient Name line ~97pt  -> 97/792=12.2%  text sits ~1 line above -> 11.5%
// SSN same row right col   -> 11.5%
// Employer ~140pt -> 17.7%
// DOB ~140pt right -> 17.7%
// Address ~183pt -> 23.1%
// Location# ~183pt right -> 23.1%
// Staffing agency ~226pt -> 28.5%
// Work Related checkboxes ~270pt -> 34.1%
// Date of Injury line ~313pt -> 39.5%
// SAT checkboxes: ~345-390pt -> 43.5-49.2%
// Type SAT: ~420-470pt -> 53-59.3%
// Phys Exam right col: ~270-285pt -> 34.1-36%

// Billing: ~455pt -> 57.4%
// Comments: ~485pt -> 61.2%
// Auth by: ~560pt -> 70.7%
// Title: ~560pt right -> 70.7%
// Phone: ~600pt -> 75.8%

function renderBAT(W, H, ov) {
  txt(ov,W,H,  9,  11.8, v('b-patient'),   10);

  txt(ov,W,H,  9,  23.2, v('b-address'),   10);
  txt(ov,W,H, 55,  23.2, v('b-locnum'),    10);
  txt(ov,W,H,  9,  28.8, v('b-agency'),    10);
  txt(ov,W,H,  9,  39.8, fmtDate(v('b-injuryDate')), 10);
  txt(ov,W,H,  9,  61.5, v('b-comments'),  10);
  txt(ov,W,H,  9,  71.0, v('b-authBy'),    10);

  txt(ov,W,H,  9,  76.0, v('b-phone'),     10);
  txt(ov,W,H, 55,  76.5, fmtDate(v('b-date')), 10);

  // Work Related
  box(ov,W,H,  3.0, 34.3, chk('b-injury'));
  box(ov,W,H, 13.5, 34.3, chk('b-illness'));

  // Substance Abuse Testing
  box(ov,W,H,  3.0, 43.8, chk('b-regDrug'));

  box(ov,W,H,  3.0, 48.5, chk('b-collect'));

  box(ov,W,H,  3.0, 53.2, chk('b-nonReg'));
  box(ov,W,H, 33.5, 53.2, chk('b-rapid'));
  txt(ov,W,H,  7.5, 57.8, v('b-satOther'), 10);

  // Type of SAT
  box(ov,W,H,  3.0, 63.5, chk('b-preplacement'));
  box(ov,W,H, 24.0, 63.5, chk('b-reasonable'));
  box(ov,W,H,  3.0, 68.0, chk('b-postAccident'));
  box(ov,W,H, 24.0, 68.0, chk('b-random'));
  box(ov,W,H,  3.0, 72.5, chk('b-followup'));

  // Physical Exam (right column)
  box(ov,W,H, 54.5, 34.3, chk('b-phyPre'));
  box(ov,W,H, 68.0, 34.3, chk('b-phyBase'));
  box(ov,W,H, 79.5, 34.3, chk('b-phyAnnual'));
  box(ov,W,H, 90.5, 34.3, chk('b-phyExit'));

  // DOT Physical
  box(ov,W,H, 54.5, 43.8, chk('b-dotPre'));
  box(ov,W,H, 73.5, 43.8, chk('b-dotRecert'));

  // Special Exam
  box(ov,W,H, 54.5, 52.5, chk('b-asbestos'));
  box(ov,W,H, 67.5, 52.5, chk('b-resp'));
  box(ov,W,H, 80.0, 52.5, chk('b-audio'));
  box(ov,W,H, 54.5, 57.2, chk('b-hpe'));
  box(ov,W,H, 54.5, 63.5, chk('b-hazmat'));
  box(ov,W,H, 71.0, 63.5, chk('b-medSurv'));
  txt(ov,W,H, 58.0, 68.2, v('b-specOther'), 10);

  // Billing
  box(ov,W,H, 54.5, 73.5, chk('b-empPay'));
}
